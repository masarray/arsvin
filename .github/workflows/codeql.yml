name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '21 3 * * 1'

permissions:
  security-events: write
  contents: read

env:
  ARIEC61850_REF: agent/sv-core-unification

jobs:
  analyze:
    name: Analyze C# solution
    runs-on: windows-2025
    defaults:
      run:
        working-directory: arsvin
    env:
      ARIEC61850_ROOT: ${{ github.workspace }}\ARIEC61850
    steps:
      - name: Checkout ARSVIN into paired workspace
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          path: arsvin

      - name: Checkout sibling ARIEC61850
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: masarray/ARIEC61850
          ref: ${{ env.ARIEC61850_REF }}
          path: ARIEC61850

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.4xx
          cache: true
          cache-dependency-path: |
            arsvin/Directory.Packages.props
            arsvin/src/**/packages.lock.json
            arsvin/tests/**/packages.lock.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: csharp
          build-mode: manual

      - name: Restore paired solution dependency graph
        run: dotnet restore ARSVIN.sln

      - name: Build paired solution with warnings as errors
        run: dotnet build ARSVIN.sln -c Release --no-restore -warnaserror

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
