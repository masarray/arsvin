name: Release Portable Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish win-x64 portable package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/ARSVIN/ARSVIN.csproj

      - name: Publish single EXE
        shell: pwsh
        run: |
          dotnet publish src/ARSVIN/ARSVIN.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/ARSVIN-win-x64

      - name: Add release notes
        shell: pwsh
        run: |
          Copy-Item README.md artifacts/ARSVIN-win-x64/README.txt
          Copy-Item LICENSE artifacts/ARSVIN-win-x64/LICENSE.txt
          Compress-Archive -Path artifacts/ARSVIN-win-x64/* -DestinationPath artifacts/ARSVIN-win-x64-portable.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARSVIN-win-x64-portable
          path: artifacts/ARSVIN-win-x64-portable.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/ARSVIN-win-x64-portable.zip
          generate_release_notes: true
