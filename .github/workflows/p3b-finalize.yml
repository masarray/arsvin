name: Temporary P3B Finalization

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/p3b-observation-pipeline
          fetch-depth: 0

      - name: Apply final P3B documentation and gate updates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, transform):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              file.write_text(transform(text), encoding='utf-8', newline='\n')

          edit('scripts/test-with-coverage.ps1', lambda s:
               re.sub(r'\$MinimumWholeEngineLineCoverage = [0-9.]+,', '$MinimumWholeEngineLineCoverage = 14.25,',
               re.sub(r'\$MinimumLineCoverage = [0-9.]+,', '$MinimumLineCoverage = 72.5,', s, count=1), count=1))

          edit('.github/workflows/ci.yml', lambda s:
               re.sub(r'-MinimumWholeEngineLineCoverage [0-9.]+ -MinimumLineCoverage [0-9.]+ -NoRestore',
                      '-MinimumWholeEngineLineCoverage 14.25 -MinimumLineCoverage 72.5 -NoRestore', s, count=1))

          def readme(s):
              s = re.sub(r'-MinimumWholeEngineLineCoverage [0-9.]+ -MinimumLineCoverage [0-9.]+',
                         '-MinimumWholeEngineLineCoverage 14.25 -MinimumLineCoverage 72.5', s, count=1)
              return re.sub(r'The current baseline contains 74 deterministic tests\.[^\n]*',
                            'The current baseline contains 88 deterministic tests. Whole-engine coverage is 14.61% across 16,582 instrumented lines, while protocol-core coverage is 72.76% across 2,390 lines. CI enforces floors of 14.25% and 72.5% respectively; these values are engineering regression evidence, not formal protocol conformance evidence.',
                            s, count=1)
          edit('README.md', readme)

          def build_doc(s):
              s = re.sub(r'-MinimumWholeEngineLineCoverage [0-9.]+ -MinimumLineCoverage [0-9.]+',
                         '-MinimumWholeEngineLineCoverage 14.25 -MinimumLineCoverage 72.5', s, count=1)
              return re.sub(r'The documented baseline contains 74 deterministic tests,[^\n]*',
                            'The documented baseline contains 88 deterministic tests. Whole-engine coverage is 14.61% with 2,423 of 16,582 lines covered, and protocol-core coverage is 72.76% with 1,739 of 2,390 lines covered. CI enforces floors of 14.25% and 72.5%. These values are regression evidence, not formal conformance, complete live-network validation, deterministic timing evidence, or universal device-interoperability evidence.',
                            s, count=1)
          edit('docs/build-and-release.md', build_doc)

          def profile_doc(s):
              s = re.sub(
                  r'```text\nParsed live or PCAP frame.*?SvConfigurationComparer\n```',
                  '''```text\nLive Npcap frame ─┐\n                  ├── SvStreamObservationManager\nImported PCAP ────┘          ↓\n                     per-stream bounded window\n                              ↓\n                    SvObservedStreamFacts\n                         ├── SvProfileDetector\n                         └── SvConfigurationComparer\n```''',
                  s, count=1, flags=re.S)
              s = s.replace(
                  'The profile infrastructure is part of the shared `ARSVIN.Engine` assembly and has no dependency on WPF or Npcap.',
                  'The profile infrastructure is part of the shared `ARSVIN.Engine` assembly and has no dependency on WPF or Npcap. Subscriber live capture and PCAP replay now use the same manager and stable stream identity, so both paths produce the same facts and diagnostics contract.', 1)
              return re.sub(
                  r'## Next integration\n.*\Z',
                  '''## Current integration boundary\n\n`SvStreamObservationManager` now:\n\n- accepts parsed frames from live Npcap capture and classic-PCAP replay;\n- groups frames by source, destination, VLAN, APPID, `svID`, and dataset reference;\n- deliberately keeps `confRev` outside the key so revision changes remain observable;\n- retains input provenance (`LiveCapture` or `PcapReplay`);\n- adds SCL-derived dataset signatures when a stream is bound; and\n- exposes immutable rolling facts to the Subscriber runtime snapshot.\n\n## Next integration\n\n1. Convert selected SCL stream bindings into `SvExpectedStreamConfiguration`.\n2. Run strict or compatible configuration comparison per observed stream.\n3. Present one compact profile/confidence and SCL-match state per selected stream.\n4. Show evidence and mismatch details on demand rather than adding permanent visual noise.\n5. Add profile-specific definitions only after source review and deterministic evidence.\n''',
                  s, count=1, flags=re.S)
          edit('docs/sv-profile-infrastructure.md', profile_doc)

          def changelog(s):
              anchor = '- Added public terminology-neutrality validation to CI and Pages deployment with retained validation evidence.\n'
              if 'Added a shared per-stream observation manager' not in s:
                  s = s.replace(anchor, anchor + '- Added bounded, thread-safe SV observation windows with fact provenance and explicit sequential, gap, duplicate, out-of-order/reset, and confirmed-wrap analysis.\n- Added a shared per-stream observation manager used identically by live Npcap capture and PCAP replay.\n- Added stable stream identity, input-source tracking, SCL-derived dataset signatures, immutable observation snapshots, and deterministic live/PCAP pipeline tests.\n', 1)
              s = s.replace('- Expanded the deterministic suite from 54 to 74 tests.', '- Expanded the deterministic suite from 54 to 88 tests.', 1)
              s = s.replace('- Raised whole-engine coverage from 10.74% to 13.35% and the enforced floor from 10.5% to 13%.', '- Raised whole-engine coverage from 10.74% to 14.61% and the enforced floor from 10.5% to 14.25%.', 1)
              s = s.replace('- Raised protocol-core coverage from 64.97% to 70.47% and the enforced floor from 60% to 70%.', '- Raised protocol-core coverage from 64.97% to 72.76% and the enforced floor from 60% to 72.5%.', 1)
              anchor = '- Sparse evidence can no longer produce a `Confirmed` profile result; confirmation requires sufficient evaluated evidence plus matching dataset and sampling behavior.\n'
              if 'Research-candidate confidence is capped' not in s:
                  s = s.replace(anchor, anchor + '- Research-candidate confidence is capped at `Possible`, generic implemented profiles are capped at `Likely`, and raw detector confidence remains available separately.\n- Subscriber live and PCAP paths now share one observation pipeline and no longer split a stream solely because `confRev` changes.\n', 1)
              if 'MAC-address formatting normalization is no longer applied' not in s:
                  s = s.replace('\n## 0.4.0 — 2026-07-12\n', '\n### Fixed\n\n- MAC-address formatting normalization is no longer applied to `svID` or dataset references, preventing punctuation-related false matches.\n- Backward sample-counter transitions require zero plus sequential recovery before they are classified as wraps.\n\n## 0.4.0 — 2026-07-12\n', 1)
              return s
          edit('CHANGELOG.md', changelog)
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No finalization changes were needed.'
            exit 0
          fi
          git add README.md CHANGELOG.md docs/build-and-release.md docs/sv-profile-infrastructure.md scripts/test-with-coverage.ps1 .github/workflows/ci.yml
          git commit -m 'Document unified observation pipeline and raise coverage gates'
          git push origin HEAD:agent/p3b-observation-pipeline
