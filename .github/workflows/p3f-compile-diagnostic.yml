name: P3F Compile Diagnostic

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-log:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.4xx

      - name: Restore
        run: dotnet restore ARSVIN.sln --locked-mode

      - name: Prepare diagnostic output
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts | Out-Null

      - name: Capture Publisher build log
        id: publisher
        continue-on-error: true
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet build src/ARSVIN/ARSVIN.csproj -c Release --no-restore -warnaserror *> artifacts/p3f-publisher-build.log
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Capture Subscriber build log
        id: subscriber
        continue-on-error: true
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet build src/ARSVIN.Subscriber/ARSVIN.Subscriber.csproj -c Release --no-restore -warnaserror *> artifacts/p3f-subscriber-build.log
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Upload complete compiler logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: p3f-compiler-logs
          path: artifacts/p3f-*-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce compiler results
        if: steps.publisher.outputs.exit_code != '0' || steps.subscriber.outputs.exit_code != '0'
        shell: pwsh
        run: exit 1
