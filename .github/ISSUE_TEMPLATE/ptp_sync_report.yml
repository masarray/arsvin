name: PTP / SV sync compatibility report
description: Report relay behavior related to PTP, smpSynch, or SV acceptance
title: "[PTP/SV]: "
labels: ["ptp", "sampled-values", "compatibility"]
body:
  - type: textarea
    id: relay
    attributes:
      label: Relay / IED under test
    validations:
      required: true
  - type: textarea
    id: topology
    attributes:
      label: Test topology
      description: PC adapter, switch, VLAN, external PTP grandmaster, relay ports.
    validations:
      required: true
  - type: input
    id: ptp_domain
    attributes:
      label: PTP domain/profile
      placeholder: "IEC/IEEE 61850-9-3, domain 0"
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Does relay accept SV only when PTP is locked? Any alarms?
    validations:
      required: true
